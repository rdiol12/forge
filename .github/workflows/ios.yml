name: Build and publish IPA

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    name: Test, build, and publish unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show build tools
        run: |
          xcodebuild -version
          swift --version

      - name: Test the shared Swift core
        run: swift test

      - name: Build the iOS device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Forge.xcodeproj \
            -scheme Forge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | xcbeautify

      - name: Package and check the unsigned IPA
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/Forge.app"
          test -f "$app/Info.plist"
          test -x "$app/Forge"
          xcrun vtool -show-build "$app/Forge"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/Forge.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" dist/Forge-unsigned.ipa
          unzip -tq dist/Forge-unsigned.ipa
          unzip -l dist/Forge-unsigned.ipa 'Payload/Forge.app/Info.plist' 'Payload/Forge.app/Forge'
          cd dist
          shasum -a 256 Forge-unsigned.ipa > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Keep the IPA as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Forge-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/Forge-unsigned.ipa
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish the private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            prerelease=false
          else
            tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            prerelease=true
          fi
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/Build/Products/Release-iphoneos/Forge.app/Info.plist)
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Native SwiftUI GitHub client for iOS 17 and later.

          **Unsigned IPA:** sign `Forge-unsigned.ipa` with your sideloading tool before installing. No Apple certificate or provisioning profile is included.

          Includes Actions monitoring, build artifact downloads, release download counts, and Save to Files.

          Commit: $GITHUB_SHA
          Build: $GITHUB_RUN_NUMBER (attempt $GITHUB_RUN_ATTEMPT)
          Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Verify the download with the attached `SHA256SUMS` file.
          EOF
          gh release create "$tag" dist/Forge-unsigned.ipa dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Forge $version · build $GITHUB_RUN_NUMBER (unsigned)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft --prerelease="$prerelease"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$prerelease"
          release_url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          printf '### Unsigned IPA published\n\n[Download Forge](%s)\n\nSign the IPA with your sideloading tool before installing.\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
