name: Build and publish iOS and Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    name: Test and build iOS
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact-name: Forge-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
      version: ${{ steps.package.outputs.version }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select and show build tools
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Test the shared Swift core
        run: swift test

      - name: Test OAuth backend security boundaries
        run: node --test Backend/auth.test.mjs

      - name: Build the iOS device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Forge.xcodeproj \
            -scheme Forge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | xcbeautify

      - name: Check iPhone downloads
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Scripts/CheckDownloads.sh

      - name: Keep iPhone download check results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iOS-checks-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/download-check.json
          if-no-files-found: error
          retention-days: 14

      - name: Package and check the unsigned IPA
        id: package
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/Forge.app"
          test -f "$app/Info.plist"
          test -x "$app/Forge"
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          xcrun vtool -show-build "$app/Forge"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/Forge.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" dist/Forge-unsigned.ipa
          unzip -tq dist/Forge-unsigned.ipa
          unzip -l dist/Forge-unsigned.ipa 'Payload/Forge.app/Info.plist' 'Payload/Forge.app/Forge'
          cd dist
          shasum -a 256 Forge-unsigned.ipa > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Keep the IPA as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Forge-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/Forge-unsigned.ipa
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Keep build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/simulator-build.log
            dist/download-check.json
          if-no-files-found: ignore
          retention-days: 7

  apk:
    name: Test and build Android
    outputs:
      artifact-name: Forge-Android-${{ github.run_number }}-${{ github.run_attempt }}
      version: ${{ steps.package.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Android
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            Android/**/*.gradle.kts
            Android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Prepare Android SDK and signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/forge-android.jks"
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          chmod +x gradlew
          sudo chmod 666 /dev/kvm

      - name: Test, lint, and build APKs
        env:
          FORGE_KEYSTORE: ${{ runner.temp }}/forge-android.jks
          FORGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest --console=plain

      - name: Verify native Android screens, secure storage, and authenticated GitHub reads
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: Android
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -t -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell run-as app.forge.github.debug mkdir -p files
            printf '%s' "$GH_TOKEN" | adb shell run-as app.forge.github.debug tee files/live-token > /dev/null
            mkdir -p ../dist/android-checks
            adb shell am instrument -w -r app.forge.github.debug.test/androidx.test.runner.AndroidJUnitRunner | tee ../dist/android-checks/instrumentation.txt
            adb shell run-as app.forge.github.debug rm files/live-token
            grep -Eq '^OK \([1-9][0-9]* tests?\)' ../dist/android-checks/instrumentation.txt
            adb install -r app/build/outputs/apk/release/app-release.apk
            # Pixel Launcher can leave an unrelated ANR dialog covering the app under test.
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell am start -W -n app.forge.github/.MainActivity
            adb shell pidof app.forge.github
            for attempt in 1 2 3 4 5; do adb shell uiautomator dump /sdcard/forge-release.xml > /dev/null; adb shell cat /sdcard/forge-release.xml > ../dist/android-checks/release-home.xml; grep -q 'text="Home"' ../dist/android-checks/release-home.xml && break; sleep 2; done
            grep -q 'text="Home"' ../dist/android-checks/release-home.xml

      - name: Verify and package the signed APK
        id: package
        run: |
          set -euo pipefail
          mkdir -p ../dist/android
          cp app/build/outputs/apk/release/app-release.apk ../dist/android/Forge-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ../dist/android/Forge-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ../dist/android/Forge-android.apk
          version=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ../dist/android/Forge-android.apk | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p")
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          unzip -tq ../dist/android/Forge-android.apk
          cd ../dist/android
          sha256sum Forge-android.apk > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Keep the signed APK as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Forge-Android-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/android/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Keep Android check results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Android-checks-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/android-checks/
            Android/app/build/reports/tests/
            Android/app/build/reports/androidTests/
            Android/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/forge-android.jks"

      - name: Keep diagnostics if a check fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Android-failure-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            Android/app/build/reports/
            dist/android-checks/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish iOS and Android together
    needs: [ipa, apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      IPA_ARTIFACT: ${{ needs.ipa.outputs.artifact-name }}
      APK_ARTIFACT: ${{ needs.apk.outputs.artifact-name }}
      VERSION: ${{ needs.ipa.outputs.version }}
      ANDROID_VERSION: ${{ needs.apk.outputs.version }}
    steps:
      - name: Collect both tested apps and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          test -n "$VERSION"
          test "$VERSION" = "$ANDROID_VERSION"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$IPA_ARTIFACT" --dir artifacts/ios
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$APK_ARTIFACT" --dir artifacts/android
          (cd artifacts/ios && sha256sum -c SHA256SUMS)
          (cd artifacts/android && sha256sum -c SHA256SUMS)
          mkdir release
          cp artifacts/ios/Forge-unsigned.ipa artifacts/android/Forge-android.apk release/
          cd release
          sha256sum Forge-unsigned.ipa Forge-android.apk > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish one public release with IPA and APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            prerelease=false
          else
            tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            prerelease=true
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Forge $VERSION for **iOS and Android**, built and tested from the same source commit.

          - **iOS 17+:** download Forge-unsigned.ipa and sign it with your sideloading tool before installing. No Apple certificate or provisioning profile is included.
          - **Android 8.0+:** download and install Forge-android.apk. It uses Forge's persistent signing key so future builds can update the same app.

          New in 0.9.3: long-press a Download control or an entry in Downloads to copy its download link. Release files use their direct GitHub download URL, and Actions artifacts link to their download page (GitHub sign-in may be required). Builds keep test results but no longer generate or upload screenshots.

          New in 0.9.2: Home includes pull requests and issues submitted by others to repositories you own, alongside conversations you participate in. Pull requests are grouped by repository, with repository owners and PR authors labeled. PRs have a left-hand changed-files panel, searchable paths, old/new line numbers, syntax colors and red/green diff backgrounds. The file panel collapses on phones and stays beside the diff on wider screens. Profile READMEs now use the same full-width layout and image rendering as repository READMEs.

          Commit removal merges separate text edits and offers an in-app file conflict editor when review is needed. Resolutions are tied to exact file revisions, and the final branch update still requires the original expected head. Root/merge rewrites and file/directory collisions still need desktop Git.

          New in 0.9: deployment approvals/rejections from Actions runs; draft/ready PR controls; changed-file filtering; copy file paths; README and Markdown contents navigation; saved code/document snapshots for offline reading; in-app Wiki access; and list position, filters and loaded-page restoration. Repository headers, shortcuts, branches and README headings align left, with a larger avatar. Failed downloads have a visible Remove control.

          Offline copies save up to 100 text files (1 MiB each / 10 MiB total) from one branch per repository. Omitted files are counted; images, full Git history and live collaboration need a connection. Copies stay on this device and are removed on disconnect/account change. Wiki uses GitHub's page in the in-app browser; private Wiki access requires website sign-in.

          iPhone downloads recover in the foreground if the background download service rejects a transfer. The iPhone simulator checks real release, Actions-artifact and repository downloads before publication. Includes the shared Forge icon, installed version/build in Settings and full-width repository READMEs.

          New in 0.8: repository cards and menus; README images, tables and editing; profile pins, followers and account editing; native issue creation with assignees, labels, milestones and Projects; Actions grouped by repository; releases sorted newest first; response caching and local download deletion. Includes branch switching, syntax-colored code, artifacts, per-release-file download counts, native Discussions, PR reviews and confirmed merges.

          Commit history supports undo or removal with confirmation, plus Deleted commits grouped by repository. Recovery saves commit SHAs locally on this device, without creating backup tags. Restore or reapply works only while GitHub still retains the required objects; retention is not guaranteed. Repository, profile, release and history changes require the appropriate GitHub permissions.

          Manual token sign-in is available. Browser sign-in still needs GitHub OAuth registration and backend activation. GitHub does not expose Actions-artifact download counts. No push alerts or PR merge-conflict editor yet.

          Both platforms passed their build and test checks before this release was published. Verify either download with the attached SHA256SUMS file.

          Commit: $GITHUB_SHA
          Build: $GITHUB_RUN_NUMBER (attempt $GITHUB_RUN_ATTEMPT)
          Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Forge $VERSION - iOS and Android - build $GITHUB_RUN_NUMBER" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --draft --prerelease="$prerelease"
          gh release upload "$tag" release/Forge-unsigned.ipa release/Forge-android.apk release/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          release_api=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json apiUrl --jq .apiUrl)
          assets=$(gh api "$release_api/assets" --jq '[.[] | select(.state == "uploaded" and .size > 0) | .name] | sort | join(",")')
          test "$assets" = 'Forge-android.apk,Forge-unsigned.ipa,SHA256SUMS'
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$prerelease"
          release_url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          printf '### iOS and Android published together\n\n[Download both apps](%s)\n\nSign the IPA with your sideloading tool. The APK is ready to install.\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
