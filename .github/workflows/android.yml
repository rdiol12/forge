name: Build and publish Android APK

on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths: ['Android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Android
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Prepare Android SDK and signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/forge-android.jks"
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          chmod +x gradlew
          sudo chmod 666 /dev/kvm

      - name: Test, lint, and build APKs
        env:
          FORGE_KEYSTORE: ${{ runner.temp }}/forge-android.jks
          FORGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest --console=plain

      - name: Verify native Android screens, secure storage, and private GitHub reads
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: Android
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as app.forge.github.debug mkdir -p files
            printf '%s' "$GH_TOKEN" | adb shell run-as app.forge.github.debug tee files/live-token > /dev/null
            ./gradlew --no-daemon connectedDebugAndroidTest --console=plain
            mkdir -p ../dist/android-screenshots
            adb pull /sdcard/Android/data/app.forge.github.debug/files/screenshots/. ../dist/android-screenshots/
            adb shell run-as app.forge.github.debug rm files/live-token
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n app.forge.github/.MainActivity
            sleep 3
            adb shell pidof app.forge.github
            adb shell uiautomator dump /sdcard/forge-release.xml
            adb shell cat /sdcard/forge-release.xml | grep 'text="Home"'
            adb exec-out screencap -p > ../dist/android-screenshots/release-home.png

      - name: Verify and package the signed APK
        run: |
          set -euo pipefail
          mkdir -p ../dist/android
          cp app/build/outputs/apk/release/app-release.apk ../dist/android/Forge-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ../dist/android/Forge-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ../dist/android/Forge-android.apk
          unzip -tq ../dist/android/Forge-android.apk
          cd ../dist/android
          sha256sum Forge-android.apk > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Keep the APK and checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Forge-Android-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/android/
            dist/android-screenshots/
            Android/app/build/reports/tests/
            Android/app/build/reports/androidTests/
            Android/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 14

      - name: Publish private APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          cat > "$RUNNER_TEMP/android-release.md" <<EOF
          Native Kotlin/Jetpack Compose GitHub companion for Android 8.0 and later.

          Download and install **Forge-android.apk**. It is signed with Forge's persistent private distribution key; future APK releases can update the same app.

          Home, Inbox, Explore and Profile; native followers/following; private repositories and owned-repository Actions; jobs, logs, artifacts and downloads; release files with GitHub download counts; branch switching, syntax-colored code, Markdown/JSON previews and README commits. Native issues, Discussion replies, PR reviews, inline comments, review-thread resolution and confirmed merges. Admin visibility changes and release editing/deletion require repository permissions and confirmation.

          Browser OAuth needs the existing GitHub registration/backend activation. Personal access token sign-in is available now. GitHub does not expose Actions-artifact download counts. No push alerts, merge-conflict editor or Enterprise hosts. Background archives use Android's download manager; direct API files need the app running.

          Validation: unit tests, Android lint, emulator UI/Keystore tests, private GitHub read checks, APK signature and checksum verification.

          Source: $GITHUB_SHA
          Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Forge Android 0.7.0 - build $GITHUB_RUN_NUMBER" --notes-file "$RUNNER_TEMP/android-release.md" --draft --prerelease
          gh release upload "$tag" ../dist/android/Forge-android.apk ../dist/android/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          release_api=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json apiUrl --jq .apiUrl)
          assets=$(gh api "$release_api/assets" --jq '[.[] | select(.state == "uploaded" and .size > 0) | .name] | sort | join(",")')
          test "$assets" = 'Forge-android.apk,SHA256SUMS'
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          printf '### Android APK published\n\n[Download Forge Android](https://github.com/%s/releases/tag/%s)\n' "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/forge-android.jks"

      - name: Keep diagnostics if a check fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Android-checks-${{ github.run_number }}-${{ github.run_attempt }}
          path: Android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
